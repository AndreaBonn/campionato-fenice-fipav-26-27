<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenice - Seconda Divisione Femminile 2026/27</title>
<meta name="description" content="Calendario e risultati dell'ASD Fenice, Seconda Divisione Femminile 2026/27, Girone A. Dati FIPAV Online.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2C1B73" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Fenice">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#calendar">Vai al calendario</a>
<header class="site">
  <div class="wrap brand">
    <img src="logo-fenice.png" width="48" height="48" alt="Stemma dell'ASD Fenice">
    <div>
      <h1>Asd Fenice</h1>
      <p>Seconda Divisione Femminile 2026/27, Girone A</p>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="next" class="hero" aria-labelledby="next-title" hidden>
    <h2 id="next-title" class="sr-only">Prossima partita</h2>
    <div id="next-body"></div>
  </section>
  <section id="last" class="hero last" aria-labelledby="last-title" hidden>
    <h2 id="last-title" class="sr-only">Ultimo risultato</h2>
    <div id="last-body"></div>
  </section>
  <section id="standings" aria-labelledby="standings-title" hidden>
    <h2 id="standings-title">Classifica</h2>
    <div id="standings-body"></div>
  </section>
  <section id="analysis" aria-labelledby="analysis-title" hidden>
    <h2 id="analysis-title">Analisi della Fenice</h2>
    <div id="analysis-body"></div>
  </section>
  <section id="calendar" aria-labelledby="calendar-title">
    <h2 id="calendar-title">Calendario e risultati</h2>
    <div id="feed"></div>
    <div id="list" aria-live="polite"></div>
  </section>
  <section id="notices" aria-labelledby="notices-title">
    <h2 id="notices-title">Notizie dal Comitato</h2>
    <div id="notices-body"></div>
  </section>
  <noscript><p class="state">Per vedere il calendario serve JavaScript attivo nel browser.</p></noscript>
</main>
<footer class="site">
  <div class="wrap">
    <p>Fonte: <a href="https://www.fipavonline.it" target="_blank" rel="noopener">FIPAV Online</a>. Sito non ufficiale.</p>
    <p id="checked" hidden></p>
  </div>
</footer>
<dialog id="opponent" class="opp" aria-labelledby="opp-title"><div id="opp-body"></div></dialog>
<script type="module">
import { renderCalendarFeed, renderChecked, renderError, renderHero, renderLastResult, renderLoading, renderSchedule } from "./games-view.js";
import { installCrestFallback, renderStandings } from "./tables-view.js";
import { renderNotices } from "./notices-view.js";
import { renderAnalysis } from "./analysis-view.js";
import { installOpponentDialog } from "./opponent-view.js";

const $ = (id) => document.getElementById(id);
// Past this wait the page admits the network is slow
const SLOW_LOAD_MS = 15000;
const CLOCK_TICK_MS = 60000;
let checkedAt = null;
let currentData = null;

installCrestFallback($("standings-body"));
installOpponentDialog(document, $("opponent"), $("opp-body"), () => currentData);

function showChecked() {
  if (!checkedAt) return;
  const el = $("checked");
  el.textContent = renderChecked(checkedAt, new Date());
  el.hidden = false;
}

// status.json is optional: without it (local run, first deploy) the line stays hidden
async function loadStatus() {
  try {
    const r = await fetch("status.json", { cache: "no-cache" });
    if (!r.ok) return;
    checkedAt = (await r.json()).checked_at ?? null;
    showChecked();
  } catch (err) {
    console.warn("status.json not available", err);
  }
}

async function fetchData() {
  const r = await fetch("data.json", { cache: "no-cache" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// A TypeError while building the markup is bad data, not a dead network: the cause text must not say so
function build(data, now) {
  try {
    return { hero: renderHero(data, now), list: renderSchedule(data, now), standings: renderStandings(data), last: renderLastResult(data), feed: renderCalendarFeed(data), analysis: renderAnalysis(data), notices: renderNotices(data) };
  } catch (err) {
    throw new Error("invalid data", { cause: err });
  }
}

function showSlowNote() {
  const box = $("list").querySelector(".state");
  if (box) box.insertAdjacentHTML("afterbegin", "<p>Ci sta mettendo più del previsto: la rete è lenta.</p>");
}

async function load() {
  $("next").hidden = true;
  $("next-body").innerHTML = "";
  $("standings").hidden = true;
  $("last").hidden = true;
  $("analysis").hidden = true;
  $("list").setAttribute("aria-busy", "true");
  $("list").innerHTML = renderLoading();
  const slow = setTimeout(showSlowNote, SLOW_LOAD_MS);
  loadStatus();
  try {
    const data = await fetchData();
    const { hero, list, standings, last, feed, analysis, notices } = build(data, new Date());
    currentData = data;
    $("next-body").innerHTML = hero;
    $("next").hidden = !hero;
    $("list").innerHTML = list;
    $("standings-body").innerHTML = standings;
    $("last-body").innerHTML = last;
    $("feed").innerHTML = feed;
    $("last").hidden = !last;
    $("standings").hidden = !standings;
    $("analysis-body").innerHTML = analysis;
    $("analysis").hidden = !analysis;
    $("notices-body").innerHTML = notices;
  } catch (err) {
    console.error("load failed", err);
    $("list").innerHTML = renderError(err, location.protocol);
  } finally {
    clearTimeout(slow);
    $("list").setAttribute("aria-busy", "false");
  }
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#retry")) load();
});
setInterval(showChecked, CLOCK_TICK_MS);
load();
</script>
</body>
</html>
